name: Build FPSOverlay V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build tweak
        run: |
          set -e
          make clean || true
          make FINALPACKAGE=1

      - name: Verify and package
        run: |
          set -e

          REAL_DYLIB=".theos/obj/arm64/FPSOverlay.dylib"

          if [ ! -f "$REAL_DYLIB" ]; then
            echo "ERROR: $REAL_DYLIB not found"
            find .theos -type f -name "*.dylib" -print
            exit 1
          fi

          mkdir -p artifact
          cp "$REAL_DYLIB" artifact/FPSOverlay.dylib

          echo "=== file ==="
          file artifact/FPSOverlay.dylib

          echo "=== architecture ==="
          lipo -info artifact/FPSOverlay.dylib

          echo "=== dependencies ==="
          otool -L artifact/FPSOverlay.dylib

          echo "=== size ==="
          ls -lh artifact/FPSOverlay.dylib

      - name: Upload V5
        uses: actions/upload-artifact@v4
        with:
          name: FPSOverlay-V5-LiveContainer
          path: artifact/FPSOverlay.dylib
          if-no-files-found: error
