name: Build, Sign and Release FPSOverlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign FPSOverlay
    runs-on: macos-15-intel

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Install Theos
      # ------------------------------------------------------------
      - name: Install Theos
        uses: Randomblock1/theos-action@v1


      # ------------------------------------------------------------
      # 3. Build FPSOverlay.dylib
      # ------------------------------------------------------------
      - name: Build FPSOverlay
        run: |
          set -e

          echo "Cleaning previous build..."
          make clean || true

          echo "Building FPSOverlay..."
          make FINALPACKAGE=1


      # ------------------------------------------------------------
      # 4. Verify Theos output
      # ------------------------------------------------------------
      - name: Verify Build
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "Checking:"
          echo "$D"

          test -f "$D"

          echo ""
          echo "File:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Dependencies:"
          otool -L "$D"

          echo ""
          echo "Size:"
          ls -lh "$D"


      # ------------------------------------------------------------
      # 5. Install/build ZSign for macOS
      #
      # The GitHub runner is macOS, so we use the macOS
      # version of ZSign instead of the Windows zsign.exe.
      # ------------------------------------------------------------
      - name: Install ZSign
        run: |
          set -e

          echo "Downloading ZSign source..."

          rm -rf zsign

          git clone --depth 1 \
            https://github.com/zhlynn/zsign.git \
            zsign

          echo ""
          echo "ZSign repository:"
          ls -la zsign

          echo ""
          echo "Searching for build files..."

          find zsign \
            -maxdepth 3 \
            -type f \
            \( -name "Makefile" -o -name "*.mk" \) \
            -print


      # ------------------------------------------------------------
      # 6. Build ZSign
      #
      # ZSign's source layout can change, so try its macOS
      # build directory first and then fall back to the
      # repository's standard build instructions.
      # ------------------------------------------------------------
      - name: Build ZSign
        run: |
          set -e

          cd zsign

          if [ -f "build/macos/Makefile" ]; then

            echo "Using ZSign macOS Makefile..."

            cd build/macos

            make clean || true
            make

          elif [ -f "Makefile" ]; then

            echo "Using root ZSign Makefile..."

            make clean || true
            make

          else

            echo "ZSign Makefile was not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f -print

            exit 1

          fi


      # ------------------------------------------------------------
      # 7. Locate ZSign executable
      # ------------------------------------------------------------
      - name: Locate ZSign
        id: locate_zsign
        run: |
          set -e

          echo "Searching for ZSign executable..."

          ZSIGN_PATH=""

          for candidate in \
            "./zsign/build/macos/zsign" \
            "./zsign/build/zsign" \
            "./zsign/zsign"
          do

            if [ -f "$candidate" ]; then
              ZSIGN_PATH="$candidate"
              break
            fi

          done

          if [ -z "$ZSIGN_PATH" ]; then

            echo "Known path was not found."

            find zsign \
              -type f \
              -perm +111 \
              -print

            exit 1
          fi

          chmod +x "$ZSIGN_PATH"

          echo "ZSign found:"
          echo "$ZSIGN_PATH"

          "$ZSIGN_PATH" -v || true

          echo "ZSIGN_PATH=$ZSIGN_PATH" >> "$GITHUB_ENV"


      # ------------------------------------------------------------
      # 8. Ad-hoc sign FPSOverlay.dylib
      # ------------------------------------------------------------
      - name: Sign FPSOverlay
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          test -f "$D"
          test -f "$ZSIGN_PATH"

          echo "Signing:"
          echo "$D"

          "$ZSIGN_PATH" -a "$D"

          echo ""
          echo "ZSign completed."


      # ------------------------------------------------------------
      # 9. Verify signature
      # ------------------------------------------------------------
      - name: Verify Signature
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          test -f "$D"

          echo "Final dylib:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Code signature:"
          codesign -dvvv "$D" 2>&1 || true

          echo ""
          echo "ZSign verification:"

          "$ZSIGN_PATH" "$D" || true

          echo ""
          echo "Final size:"
          ls -lh "$D"


      # ------------------------------------------------------------
      # 10. Prepare release asset
      # ------------------------------------------------------------
      - name: Prepare Release
        run: |
          set -e

          rm -rf release

          mkdir -p release

          cp \
            ".theos/obj/arm64/FPSOverlay.dylib" \
            "release/FPSOverlay.dylib"

          test -f "release/FPSOverlay.dylib"

          echo "Release asset:"
          ls -lh release/FPSOverlay.dylib


      # ------------------------------------------------------------
      # 11. Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v7.1.${{ github.run_number }}"
          name: "FPSOverlay v7.1.${{ github.run_number }}"
          body: |
            # FPSOverlay v7.1

            Compact iOS game performance overlay for LiveContainer.

            ## Performance
            - FPS
            - Average FPS
            - 1% LOW
            - 0.1% LOW
            - Frame time
            - Minimum FPS
            - Maximum FPS
            - Display refresh rate
            - Process RAM

            ## Device
            - Device model
            - Apple GPU family
            - Battery percentage

            ## Visual
            - Compact two-column HUD
            - Upper-right placement
            - Monospaced performance text
            - Live FPS graph
            - No background panel
            - Automatic window reattachment

            ## Compatibility
            - ARM64
            - LiveContainer TweakLoader
            - Primitive numeric FPS history
            - Manual-reference-counting compatible

            ## Signing
            This release is automatically ad-hoc signed with ZSign during GitHub Actions.

            The release contains:

            `FPSOverlay.dylib`

            Emulator-specific counters such as EE, GS, VU, VPS and VRAM are intentionally excluded.

          files: release/FPSOverlay.dylib
          draft: false
          prerelease: false
