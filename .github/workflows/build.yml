name: Build FPSOverlay V4

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build tweak
        run: |
          set -e

          echo "=== Cleaning ==="
          make clean || true

          echo "=== Building FPSOverlay ==="
          make FINALPACKAGE=1

      - name: Inspect Theos output
        run: |
          set -e

          echo "=== All dylib files ==="
          find .theos -type f -name "*.dylib" -print

          echo "=== All FPSOverlay files ==="
          find .theos -type f -name "FPSOverlay*" -print

      - name: Copy real dylib
        run: |
          set -e

          REAL_DYLIB=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=== Expected dylib ==="
          echo "$REAL_DYLIB"

          if [ ! -f "$REAL_DYLIB" ]; then
            echo "ERROR: FPSOverlay.dylib was not found!"
            exit 1
          fi

          echo "=== File information ==="
          file "$REAL_DYLIB"

          mkdir -p artifact

          cp "$REAL_DYLIB" artifact/FPSOverlay.dylib

          echo "=== Artifact ==="
          ls -lh artifact/FPSOverlay.dylib

      - name: Verify final dylib
        run: |
          set -e

          DYLIB="artifact/FPSOverlay.dylib"

          echo "================================"
          echo "FPSOverlay V4 Verification"
          echo "================================"

          echo ""
          echo "=== file ==="
          file "$DYLIB"

          echo ""
          echo "=== Mach-O header ==="
          otool -hv "$DYLIB"

          echo ""
          echo "=== Architecture ==="
          lipo -info "$DYLIB"

          echo ""
          echo "=== Dependencies ==="
          otool -L "$DYLIB"

          echo ""
          echo "=== Load commands ==="
          otool -l "$DYLIB" | head -n 150

          echo ""
          echo "=== File size ==="
          ls -lh "$DYLIB"

          echo ""
          echo "================================"
          echo "Verification complete"
          echo "================================"

      - name: Upload FPSOverlay V4
        uses: actions/upload-artifact@v4
        with:
          name: FPSOverlay-V4-LiveContainer
          path: artifact/FPSOverlay.dylib
          if-no-files-found: error
