name: Build and Release FPSOverlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Build tweak
        run: |
          set -e
          echo "=== Cleaning ==="
          make clean || true

          echo "=== Building FPSOverlay ==="
          make FINALPACKAGE=1

      - name: Verify dylib
        run: |
          set -e

          DYLIB=".theos/obj/arm64/FPSOverlay.dylib"

          if [ ! -f "$DYLIB" ]; then
            echo "ERROR: FPSOverlay.dylib not found!"
            exit 1
          fi

          echo "=== File ==="
          file "$DYLIB"

          echo "=== Architecture ==="
          lipo -info "$DYLIB"

          echo "=== Dependencies ==="
          otool -L "$DYLIB"

          echo "=== Size ==="
          ls -lh "$DYLIB"

      - name: Prepare release file
        run: |
          set -e
          mkdir -p release
          cp ".theos/obj/arm64/FPSOverlay.dylib" "release/FPSOverlay.dylib"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v5.1.${{ github.run_number }}"
          name: "FPSOverlay v5.1.${{ github.run_number }}"
          body: |
            ## FPSOverlay v5.1

            Lightweight FPS and frame-time overlay for LiveContainer.

            ### Features
            - FPS counter
            - Frame time in milliseconds
            - Text-only display
            - No black background
            - White text with subtle shadow
            - ARM64
            - LiveContainer TweakLoader compatible

            ### Installation
            Download `FPSOverlay.dylib` below and add it to your LiveContainer tweak folder.

            Make sure the tweak is enabled for the game you want to use it with.
          files: |
            release/FPSOverlay.dylib
          draft: false
          prerelease: false
