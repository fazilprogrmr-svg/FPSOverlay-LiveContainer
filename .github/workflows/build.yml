name: Build, Sign and Release FPSOverlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign FPSOverlay
    runs-on: macos-15-intel

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Install Theos
      - name: Install Theos
        uses: Randomblock1/theos-action@v1


      # 3. Build FPSOverlay
      - name: Build FPSOverlay
        run: |
          set -e

          echo "========================================"
          echo "Cleaning previous build"
          echo "========================================"

          make clean || true

          echo ""
          echo "========================================"
          echo "Building FPSOverlay"
          echo "========================================"

          make FINALPACKAGE=1

          echo ""
          echo "Build completed."


      # 4. Verify FPSOverlay.dylib
      - name: Verify Build
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "========================================"
          echo "Verifying FPSOverlay.dylib"
          echo "========================================"

          test -f "$D"

          echo ""
          echo "File information:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Linked libraries:"
          otool -L "$D"

          echo ""
          echo "File size:"
          ls -lh "$D"


      # 5. Download ZSign
      - name: Install ZSign
        run: |
          set -e

          echo "========================================"
          echo "Downloading ZSign"
          echo "========================================"

          rm -rf zsign

          git clone --depth 1 \
            https://github.com/zhlynn/zsign.git \
            zsign

          echo ""
          echo "ZSign downloaded successfully."

          echo ""
          echo "Searching ZSign build files..."

          find zsign -maxdepth 4 -type f \
            \( -name "Makefile" -o -name "*.mk" \) \
            -print


      # 6. Build ZSign
      - name: Build ZSign
        run: |
          set -e

          echo "========================================"
          echo "Building ZSign"
          echo "========================================"

          if [ -f "zsign/build/macos/Makefile" ]; then

            echo "Using zsign/build/macos/Makefile"

            cd zsign/build/macos

            make clean || true
            make

            cd ../../..

          elif [ -f "zsign/Makefile" ]; then

            echo "Using zsign/Makefile"

            cd zsign

            make clean || true
            make

            cd ..

          else

            echo "ERROR: ZSign Makefile not found."

            echo ""
            echo "ZSign files:"
            find zsign -maxdepth 5 -type f -print

            exit 1

          fi


      # 7. Locate ZSign executable
      - name: Locate ZSign
        id: locate_zsign
        run: |
          set -e

          echo "========================================"
          echo "Locating ZSign executable"
          echo "========================================"

          ZSIGN_PATH=""

          if [ -x "./zsign/bin/zsign" ]; then
            ZSIGN_PATH="./zsign/bin/zsign"

          elif [ -x "./zsign/build/macos/zsign" ]; then
            ZSIGN_PATH="./zsign/build/macos/zsign"

          elif [ -x "./zsign/build/zsign" ]; then
            ZSIGN_PATH="./zsign/build/zsign"

          elif [ -x "./zsign/zsign" ]; then
            ZSIGN_PATH="./zsign/zsign"

          else

            FOUND=$(find zsign -type f -name "zsign" -perm -111 | head -n 1 || true)

            if [ -n "$FOUND" ]; then
              ZSIGN_PATH="$FOUND"
            fi

          fi

          if [ -z "$ZSIGN_PATH" ]; then

            echo "ERROR: ZSign executable not found."

            echo ""
            echo "Files inside ZSign:"
            find zsign -type f -print

            exit 1

          fi

          chmod +x "$ZSIGN_PATH"

          echo ""
          echo "========================================"
          echo "ZSign FOUND"
          echo "========================================"

          echo "Path:"
          echo "$ZSIGN_PATH"

          echo ""
          echo "Version:"

          "$ZSIGN_PATH" -v || true

          echo ""
          echo "Saving ZSign path..."

          echo "ZSIGN_PATH=$ZSIGN_PATH" >> "$GITHUB_ENV"


      # 8. Sign FPSOverlay.dylib
      - name: Sign FPSOverlay
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "========================================"
          echo "Signing FPSOverlay.dylib"
          echo "========================================"

          test -f "$D"
          test -f "$ZSIGN_PATH"

          echo ""
          echo "Dylib:"
          echo "$D"

          echo ""
          echo "ZSign:"
          echo "$ZSIGN_PATH"

          echo ""
          echo "Starting signing..."

          "$ZSIGN_PATH" -a "$D"

          echo ""
          echo "Signing completed successfully."


      # 9. Verify signed dylib
      - name: Verify Signature
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "========================================"
          echo "Verifying signed dylib"
          echo "========================================"

          test -f "$D"

          echo ""
          echo "File:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Apple code signature:"
          codesign -dvvv "$D" 2>&1 || true

          echo ""
          echo "ZSign verification:"
          "$ZSIGN_PATH" "$D" || true

          echo ""
          echo "Final dylib:"
          ls -lh "$D"


      # 10. Prepare release
      - name: Prepare Release
        run: |
          set -e

          echo "========================================"
          echo "Preparing release"
          echo "========================================"

          rm -rf release
          mkdir -p release

          cp \
            ".theos/obj/arm64/FPSOverlay.dylib" \
            "release/FPSOverlay.dylib"

          test -f "release/FPSOverlay.dylib"

          echo ""
          echo "Release file:"
          ls -lh "release/FPSOverlay.dylib"


      # 11. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: "v2.0.${{ github.run_number }}"

          name: "FPSOverlay v2.0.${{ github.run_number }}"

          body: |
            # FPSOverlay

            Lightweight iOS game performance overlay for games running through LiveContainer.

            ## Features

            - Real Metal presentation FPS
            - Real frame time
            - CPU name and process usage
            - GPU name
            - RAM usage
            - Battery level
            - Display refresh rate
            - Thermal state
            - Live FPS graph
            - Game icon
            - 10 visual themes
            - iPhone Liquid Glass
            - PlayStation
            - Xbox
            - Windows Fluent
            - Steam Deck
            - Nintendo
            - ROG Gaming
            - Cyber Neon
            - MangoHUD
            - Minimal

            ## Display Modes

            - Full Performance
            - Text Only
            - FPS Only

            ## Layouts

            - Horizontal
            - Vertical

            ## Controls

            - Drag: Move overlay
            - Double-tap: Compact / Full
            - Triple-tap: Hide / Show
            - Long press: Change theme
            - Two-finger tap: Horizontal / Vertical
            - Two-finger double-tap: Change display mode

            ## Build

            The dylib is automatically built with Theos and signed with ZSign using GitHub Actions.

            Release file:

            FPSOverlay.dylib

          files: release/FPSOverlay.dylib

          draft: false
          prerelease: false
