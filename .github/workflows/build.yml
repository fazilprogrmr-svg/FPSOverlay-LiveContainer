name: Build, Sign and Release FPSOverlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign FPSOverlay
    runs-on: macos-15-intel

    steps:

      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Install Theos
      - name: Install Theos
        uses: Randomblock1/theos-action@v1


      # 3. Build FPSOverlay.dylib
      - name: Build FPSOverlay
        run: |
          set -e

          echo "=============================="
          echo "Cleaning previous build"
          echo "=============================="

          make clean || true

          echo "=============================="
          echo "Building FPSOverlay"
          echo "=============================="

          make FINALPACKAGE=1


      # 4. Verify dylib
      - name: Verify Build
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Checking FPSOverlay.dylib"
          echo "=============================="

          test -f "$D"

          echo ""
          echo "File information:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Libraries:"
          otool -L "$D"

          echo ""
          echo "File size:"
          ls -lh "$D"


      # 5. Download ZSign
      - name: Install ZSign
        run: |
          set -e

          echo "=============================="
          echo "Downloading ZSign"
          echo "=============================="

          rm -rf zsign

          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign

          echo ""
          echo "ZSign downloaded successfully."

          echo ""
          echo "Searching for build files..."

          find zsign -maxdepth 3 -type f \
            \( -name "Makefile" -o -name "*.mk" \) \
            -print


      # 6. Build ZSign
      - name: Build ZSign
        run: |
          set -e

          echo "=============================="
          echo "Building ZSign"
          echo "=============================="

          cd zsign

          if [ -f "build/macos/Makefile" ]; then

            echo "Using build/macos/Makefile"

            cd build/macos

            make clean || true
            make

          elif [ -f "Makefile" ]; then

            echo "Using main Makefile"

            make clean || true
            make

          else

            echo "ERROR: ZSign Makefile not found."

            echo ""
            echo "Files inside ZSign:"
            find . -maxdepth 4 -type f

            exit 1

          fi


      # 7. Locate ZSign
      - name: Locate ZSign
        id: locate_zsign
        run: |
          set -e

          echo "=============================="
          echo "Searching for ZSign executable"
          echo "=============================="

          ZSIGN_PATH=""

          if [ -f "./zsign/bin/zsign" ]; then

            ZSIGN_PATH="./zsign/bin/zsign"

          elif [ -f "./zsign/build/macos/zsign" ]; then

            ZSIGN_PATH="./zsign/build/macos/zsign"

          elif [ -f "./zsign/build/zsign" ]; then

            ZSIGN_PATH="./zsign/build/zsign"

          elif [ -f "./zsign/zsign" ]; then

            ZSIGN_PATH="./zsign/zsign"

          fi

          if [ -z "$ZSIGN_PATH" ]; then

            echo "ERROR: ZSign executable not found."

            echo ""
            echo "Files inside ZSign:"
            find zsign -type f -print

            exit 1

          fi

          chmod +x "$ZSIGN_PATH"

          echo ""
          echo "=============================="
          echo "ZSign FOUND"
          echo "=============================="

          echo "Path:"
          echo "$ZSIGN_PATH"

          echo ""

          echo "ZSign version:"
          "$ZSIGN_PATH" -v || true

          echo ""

          echo "Saving ZSign path..."

          echo "ZSIGN_PATH=$ZSIGN_PATH" >> "$GITHUB_ENV"


      # 8. Sign FPSOverlay
      - name: Sign FPSOverlay
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Signing FPSOverlay.dylib"
          echo "=============================="

          test -f "$D"
          test -f "$ZSIGN_PATH"

          echo ""
          echo "Dylib:"
          echo "$D"

          echo ""
          echo "ZSign:"
          echo "$ZSIGN_PATH"

          echo ""
          echo "Starting signing..."

          "$ZSIGN_PATH" -a "$D"

          echo ""
          echo "Signing completed."


      # 9. Verify signature
      - name: Verify Signature
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Verifying signed dylib"
          echo "=============================="

          test -f "$D"

          echo ""
          echo "File:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Apple code signature information:"

          codesign -dvvv "$D" 2>&1 || true

          echo ""
          echo "ZSign verification:"

          "$ZSIGN_PATH" "$D" || true

          echo ""
          echo "Final file:"
          ls -lh "$D"


      # 10. Prepare release
      - name: Prepare Release
        run: |
          set -e

          echo "=============================="
          echo "Preparing release"
          echo "=============================="

          rm -rf release

          mkdir -p release

          cp \
            ".theos/obj/arm64/FPSOverlay.dylib" \
            "release/FPSOverlay.dylib"

          test -f "release/FPSOverlay.dylib"

          echo ""
          echo "Release file:"
          ls -lh "release/FPSOverlay.dylib"


      # 11. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v2.0.${{ github.run_number }}"

          name: "FPSOverlay v2.0.${{ github.run_number }}"

          body: |
            # FPSOverlay v2

            A lightweight iOS game performance overlay for games running through LiveContainer.

            ## What's New

            ### New Theme System

            Added 10 distinct HUD themes with their own visual identity:

            - iPhone Liquid Glass
            - PlayStation
            - Xbox
            - Windows Fluent
            - Steam Deck
            - Cyber Neon
            - ROG Gaming
            - Minimal
            - MangoHUD
            - Nintendo

            The themes are designed as separate visual styles rather than simply changing the HUD accent color.

            ### iPhone Liquid Glass

            - Native `UIGlassEffect` support when available
            - Transparent glass surface
            - No forced dark mode
            - No artificial black background
            - No artificial white background
            - No fake colored glass tint
            - Transparent fallback when native Liquid Glass is unavailable

            ### New Display Modes

            - Full Performance
            - Text Only
            - FPS Only

            Text Only removes the HUD panel completely and displays performance information directly over the game.

            FPS Only displays only the current FPS value.

            ### New Overlay Layouts

            - Horizontal
            - Vertical

            Horizontal keeps the compact one-line HUD.

            Vertical arranges the performance metrics into a compact stacked layout.

            ### Performance Monitoring

            - Real rendered FPS measurement
            - Metal drawable presentation based FPS tracking
            - Frame Time
            - CPU usage
            - CPU/device information
            - GPU/device information
            - RAM usage
            - Total RAM
            - Battery percentage
            - Display refresh rate
            - Thermal state
            - Live FPS graph

            FPS and Frame Time are based on actual Metal presentation events instead of simply counting display refresh callbacks.

            ### HUD Improvements

            - Game icon support
            - Adaptive HUD sizing
            - Compact mode
            - Theme indicator
            - Saved theme selection
            - Saved layout selection
            - Saved display mode
            - Saved HUD position
            - Draggable HUD
            - Improved readability
            - Theme-specific decorations and accents

            ### Gesture Controls

            - Double tap: Toggle compact mode
            - Triple tap: Hide/show overlay
            - Long press: Change theme
            - Two-finger tap: Switch Horizontal/Vertical layout
            - Two-finger double tap: Switch display mode

            ## Installation

            1. Download `FPSOverlay.dylib`.
            2. Create or use an `FPS` folder in LiveContainer.
            3. Place `FPSOverlay.dylib` inside the folder.
            4. Open the game's settings.
            5. Select `FPS` as the Tweak Folder.
            6. Enable Tweak Loading.
            7. Launch the game.

            ## Build

            The dylib is automatically:

            - Built with Theos
            - Verified as ARM64
            - Signed with ZSign
            - Signature checked
            - Attached automatically to this GitHub Release

            ## File

            `FPSOverlay.dylib`

          files: release/FPSOverlay.dylib

          draft: false

          prerelease: false
