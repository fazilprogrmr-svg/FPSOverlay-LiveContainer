name: Build, Sign and Release FPSOverlay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign FPSOverlay
    runs-on: macos-15-intel

    steps:

      # 1. Download your GitHub repository
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Install Theos
      - name: Install Theos
        uses: Randomblock1/theos-action@v1


      # 3. Build FPSOverlay.dylib
      - name: Build FPSOverlay
        run: |
          set -e

          echo "=============================="
          echo "Cleaning previous build"
          echo "=============================="

          make clean || true

          echo "=============================="
          echo "Building FPSOverlay"
          echo "=============================="

          make FINALPACKAGE=1


      # 4. Check that the dylib was created correctly
      - name: Verify Build
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Checking FPSOverlay.dylib"
          echo "=============================="

          test -f "$D"

          echo "File information:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Libraries:"
          otool -L "$D"

          echo ""
          echo "File size:"
          ls -lh "$D"


      # 5. Download ZSign source
      - name: Install ZSign
        run: |
          set -e

          echo "=============================="
          echo "Downloading ZSign"
          echo "=============================="

          rm -rf zsign

          git clone --depth 1 https://github.com/zhlynn/zsign.git zsign

          echo ""
          echo "ZSign downloaded successfully."

          echo ""
          echo "Searching for build files..."

          find zsign -maxdepth 3 -type f \
            \( -name "Makefile" -o -name "*.mk" \) \
            -print


      # 6. Build ZSign
      - name: Build ZSign
        run: |
          set -e

          echo "=============================="
          echo "Building ZSign"
          echo "=============================="

          cd zsign

          if [ -f "build/macos/Makefile" ]; then

            echo "Using build/macos/Makefile"

            cd build/macos

            make clean || true
            make

          elif [ -f "Makefile" ]; then

            echo "Using main Makefile"

            make clean || true
            make

          else

            echo "ERROR: ZSign Makefile not found."

            echo ""
            echo "Files inside ZSign:"
            find . -maxdepth 4 -type f -print

            exit 1

          fi


      # 7. Find the ZSign executable
      - name: Locate ZSign
        id: locate_zsign
        run: |
          set -e

          echo "=============================="
          echo "Searching for ZSign executable"
          echo "=============================="

          ZSIGN_PATH=""

          # This is the location found in your previous build
          if [ -f "./zsign/bin/zsign" ]; then

            ZSIGN_PATH="./zsign/bin/zsign"

          elif [ -f "./zsign/build/macos/zsign" ]; then

            ZSIGN_PATH="./zsign/build/macos/zsign"

          elif [ -f "./zsign/build/zsign" ]; then

            ZSIGN_PATH="./zsign/build/zsign"

          elif [ -f "./zsign/zsign" ]; then

            ZSIGN_PATH="./zsign/zsign"

          fi

          if [ -z "$ZSIGN_PATH" ]; then

            echo "ERROR: ZSign executable not found."

            echo ""
            echo "Files inside ZSign:"
            find zsign -type f -print

            exit 1

          fi

          chmod +x "$ZSIGN_PATH"

          echo ""
          echo "=============================="
          echo "ZSign FOUND"
          echo "=============================="

          echo "Path:"
          echo "$ZSIGN_PATH"

          echo ""

          echo "ZSign version:"
          "$ZSIGN_PATH" -v || true

          echo ""

          echo "Saving ZSign path..."

          echo "ZSIGN_PATH=$ZSIGN_PATH" >> "$GITHUB_ENV"


      # 8. Sign FPSOverlay.dylib
      - name: Sign FPSOverlay
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Signing FPSOverlay.dylib"
          echo "=============================="

          test -f "$D"
          test -f "$ZSIGN_PATH"

          echo ""
          echo "Dylib:"
          echo "$D"

          echo ""
          echo "ZSign:"
          echo "$ZSIGN_PATH"

          echo ""
          echo "Starting signing..."

          "$ZSIGN_PATH" -a "$D"

          echo ""
          echo "Signing completed."


      # 9. Verify the signature
      - name: Verify Signature
        run: |
          set -e

          D=".theos/obj/arm64/FPSOverlay.dylib"

          echo "=============================="
          echo "Verifying signed dylib"
          echo "=============================="

          test -f "$D"

          echo ""
          echo "File:"
          file "$D"

          echo ""
          echo "Architecture:"
          lipo -info "$D"

          echo ""
          echo "Apple code signature information:"

          codesign -dvvv "$D" 2>&1 || true

          echo ""
          echo "ZSign verification:"

          "$ZSIGN_PATH" "$D" || true

          echo ""
          echo "Final file:"
          ls -lh "$D"


      # 10. Prepare GitHub Release
      - name: Prepare Release
        run: |
          set -e

          echo "=============================="
          echo "Preparing release"
          echo "=============================="

          rm -rf release

          mkdir -p release

          cp \
            ".theos/obj/arm64/FPSOverlay.dylib" \
            "release/FPSOverlay.dylib"

          test -f "release/FPSOverlay.dylib"

          echo ""
          echo "Release file:"
          ls -lh "release/FPSOverlay.dylib"


      # 11. Create GitHub Release automatically
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name: "v1.0.${{ github.run_number }}"

          name: "FPSOverlay v1.0.${{ github.run_number }}"

          body: |
            # FPSOverlay

            iOS game performance overlay for LiveContainer.

            Features:

            - FPS
            - Average FPS
            - 1% Low
            - 0.1% Low
            - Frame time
            - Minimum FPS
            - Maximum FPS
            - Refresh rate
            - RAM usage
            - Device information
            - GPU information
            - Battery level
            - Live FPS graph

            The release contains:

            FPSOverlay.dylib

            The dylib is automatically built and signed with ZSign by GitHub Actions.

          files: release/FPSOverlay.dylib

          draft: false

          prerelease: false
